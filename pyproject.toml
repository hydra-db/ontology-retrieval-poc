[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ontology-retrieval-poc"
version = "0.1.0"
description = "Bounded ontology, retrieval and background preference learning POC"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
models = ["sentence-transformers==3.3.1"]

[project.scripts]
ontology-poc = "poc.cli:main"

[tool.setuptools.packages.find]
include = ["poc*"]
