[project]
name = "orp"
version = "0.1.0"
description = "Ontology retrieval POC: transcript ingestion API and the dreaming harness that turns transcripts into typed per-user snippets"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
orp = "orp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
